# Docker Compose configuration with a managed source.
# Used for smoke-testing the managed source limit when
# an API-created managed source already exists.

sources:
  - name: local-file
    file:
      path: /examples/upstream-registry.json
    syncPolicy:
      interval: "5m"

  - name: config-managed
    managed: {}

registries:
  - name: default
    sources: ["local-file", "config-managed"]

admin:
  enabled: false
authorization:
  # Omit policyFile for built-in allow-all Cedar after authentication.
  # policyFile: /etc/registry/policies.cedar # Optional custom replacement; mount read-only.
  allowAnonymousCatalog: false
  identityMappings:
    - issuer: https://id.example.org
      groups: {claim: groups, format: string-array}
auth:
  mode: oauth
  oauth:
    providers:
      - name: company
        issuerUrl: https://id.example.org
        audience: registry-api

database:
  host: postgres
  port: 5432
  user: db_app
  migrationUser: db_migrator
  database: registry
  sslMode: disable
  maxOpenConns: 10
  maxIdleConns: 2
  connMaxLifetime: "30m"
