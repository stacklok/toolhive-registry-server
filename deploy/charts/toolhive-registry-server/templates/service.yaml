apiVersion: v1
kind: Service
metadata:
  name: {{ include "toolhive-registry-server.fullname" . }}
  labels:
    {{- include "toolhive-registry-server.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    {{- if .Values.service.exposeInternalPort }}
    - port: {{ .Values.service.internalPort }}
      targetPort: internal-http
      protocol: TCP
      name: internal-http
    {{- end }}
  selector:
    {{- include "toolhive-registry-server.selectorLabels" . | nindent 4 }}
