# Default values for toolhive-registry-server.
# This is a YAML-formatted file.

# -- Number of Registry Server pod replicas.
replicaCount: 1

image:
  # -- Registry Server container image reference, including the tag or digest.
  registryServerUrl: "ghcr.io/stacklok/thv-registry-api:v1.5.2"

  # -- Image pull policy for the Registry Server container.
  pullPolicy: IfNotPresent

# -- References to Secrets in the release namespace used to pull private
# container images.
imagePullSecrets: []
# -- Override the chart name used in resource labels and generated names.
nameOverride: ""
# -- Override the generated name of the Deployment, Service, and related
# resources.
fullnameOverride: ""

serviceAccount:
  # -- Create the ServiceAccount named by `serviceAccount.name`. Set to false to
  # use an existing ServiceAccount.
  create: true
  # -- Annotations on the ServiceAccount created by this chart.
  annotations: {}
  # -- ServiceAccount name used by the pods and RBAC bindings. When
  # `serviceAccount.create` is false, this account must already exist in the
  # release namespace.
  name: "toolhive-registry-server"

# -- Additional annotations on Registry Server pods.
podAnnotations: {}

# -- Additional labels on Registry Server pods.
podLabels: {}

# -- Kubernetes security context applied to Registry Server pods.
podSecurityContext: {}
  # fsGroup: 2000

# -- Kubernetes security context applied to the Registry Server container.
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65535
  seccompProfile:
    type: RuntimeDefault

service:
  # -- Kubernetes Service type. External Service types also expose the internal
  # port when `service.exposeInternalPort` is true.
  type: ClusterIP
  # -- Service port for the Registry Server API, forwarding to container port
  # 8080.
  port: 8080
  # -- Publish the internal listener through the Service. This listener serves
  # health checks and metrics without authentication, audit logging, or rate
  # limiting. Set to false to omit it from the Service; Kubernetes probes still
  # reach the container directly. With an externally accessible Service type,
  # enabling this setting also exposes the internal listener externally.
  exposeInternalPort: true
  # -- Service port forwarding to the internal listener on container port 8081.
  # Applies when `service.exposeInternalPort` is true. Changing this value changes
  # the Service port; the container port stays at 8081 with the default listener settings.
  internalPort: 8081
  # -- Annotations on the Registry Server Service.
  annotations: {}

# -- CPU and memory requests and limits for the Registry Server container.
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

# -- Kubernetes liveness probe for the Registry Server container.
livenessProbe:
  httpGet:
    path: /health
    port: internal-http
  initialDelaySeconds: 30
  periodSeconds: 10

# -- Kubernetes readiness probe for the Registry Server container.
readinessProbe:
  httpGet:
    path: /readiness
    port: internal-http
  initialDelaySeconds: 5
  periodSeconds: 5

# -- Node labels that Registry Server pods require for scheduling.
nodeSelector: {}

# -- Tolerations that allow Registry Server pods to be scheduled on tainted
# nodes.
tolerations: []

# -- Node and pod affinity rules for scheduling Registry Server pods.
affinity: {}

# -- Init container specifications run before the Registry Server container.
# Each init container defines its own volume mounts and can mount volumes declared
# in `extraVolumes`, for example to prepare a PostgreSQL password file.
initContainers: []
  # Example: pgpass init container for PostgreSQL authentication
  # - name: pgpass-init
  #   image: cgr.dev/chainguard/busybox:latest
  #   command:
  #     - sh
  #     - -c
  #     - |
  #       cp /pgpass-secret/.pgpass /pgpass-prepared/.pgpass
  #       chmod 600 /pgpass-prepared/.pgpass
  #   securityContext:
  #     allowPrivilegeEscalation: false
  #     capabilities:
  #       drop:
  #         - ALL
  #     readOnlyRootFilesystem: true
  #     runAsNonRoot: true
  #     runAsUser: 65535
  #   volumeMounts:
  #     - name: pgpass-secret
  #       mountPath: /pgpass-secret
  #       readOnly: true
  #     - name: pgpass-prepared
  #       mountPath: /pgpass-prepared

# ==============================================================================
# Registry Server Configuration
# ==============================================================================
# -- Registry Server application configuration rendered as `config.yaml` in a
# Kubernetes ConfigMap. Accepts any valid Registry Server configuration field.
# See [Configuration](https://github.com/stacklok/toolhive-registry-server/blob/main/docs/configuration.md).
# Supply database passwords through Secret-backed environment variables in
# `extraEnv`, a PostgreSQL password file, or dynamic authentication.

config:
  # Sources configuration - at least one source must be configured
  sources:
    - name: toolhive
      git:
        repository: https://github.com/stacklok/toolhive-catalog.git
        branch: main
        path: pkg/catalog/toolhive/data/registry-upstream.json
      syncPolicy:
        interval: "30m"

  # Registries configuration - at least one registry must be configured
  registries:
    - name: default
      sources: ["toolhive"]

  # Authentication configuration
  auth:
    mode: anonymous

  # PostgreSQL database configuration (required)
  # Supply password and migrationPassword through Secret-backed environment
  # variables in extraEnv. This block is stored in a ConfigMap, which is intended
  # for nonconfidential configuration.
  # Supported password methods:
  #   1. Environment variables: THV_REGISTRY_DATABASE_PASSWORD (see extraEnv below)
  #   2. PostgreSQL's pgpass file (~/.pgpass or $PGPASSFILE)
  #   3. Dynamic auth (e.g., AWS RDS IAM) via the dynamicAuth config block
  # See: https://www.postgresql.org/docs/current/libpq-pgpass.html
  database:
    host: ""
    port: 5432
    user: thv_user
    database: toolhive_registry
    sslMode: require

