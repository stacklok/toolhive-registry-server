# ==============================================================================
# Additional Environment Variables
# ==============================================================================

# -- Additional environment variables for the Registry Server container. Use
# `valueFrom.secretKeyRef` to supply passwords from Kubernetes Secrets.
extraEnv: []
  # Example: Database password from a Kubernetes Secret
  # - name: THV_REGISTRY_DATABASE_PASSWORD
  #   valueFrom:
  #     secretKeyRef:
  #       name: db-credentials
  #       key: password
  # - name: THV_REGISTRY_DATABASE_MIGRATIONPASSWORD
  #   valueFrom:
  #     secretKeyRef:
  #       name: db-credentials
  #       key: migration-password
  # - name: THV_REGISTRY_DATABASE_HOST
  #   value: "postgres.example.com"
  # - name: PGPASSFILE
  #   value: "/secrets/pgpass"
  # - name: THV_REGISTRY_INSECURE_URL
  #   value: "true"

# -- ConfigMap or Secret references whose keys become environment variables in
# the Registry Server container.
extraEnvFrom: []
  # - configMapRef:
  #     name: my-config
  # - secretRef:
  #     name: my-secret

# ==============================================================================
# Additional Volume Mounts
# ==============================================================================

# -- Additional Kubernetes volumes available to the Registry Server pod. Mount
# them with `extraVolumeMounts` or an init container's `volumeMounts`.
extraVolumes: []
  # - name: pgpass
  #   secret:
  #     secretName: postgres-pgpass
  #     defaultMode: 0600
  # - name: ca-certs
  #   configMap:
  #     name: ca-certificates
  # - name: registry-data
  #   persistentVolumeClaim:
  #     claimName: registry-data-pvc

# -- Additional volume mounts for the Registry Server container, referencing
# volumes declared in `extraVolumes`.
extraVolumeMounts: []
  # - name: pgpass
  #   mountPath: /secrets/pgpass
  #   subPath: pgpass
  #   readOnly: true
  # - name: ca-certs
  #   mountPath: /etc/ssl/certs
  #   readOnly: true
  # - name: registry-data
  #   mountPath: /data

# ==============================================================================
# RBAC Configuration
# ==============================================================================

# -- Kubernetes role-based access control (RBAC) settings for watching ToolHive
# resources and Services.
rbac:
  # -- Scope of permissions to watch ToolHive resources and Services. `cluster`
  # creates a ClusterRoleBinding for all namespaces. `namespace` creates a
  # RoleBinding in each namespace listed in `rbac.allowedNamespaces` and restricts
  # the server's watches to those namespaces.
  scope: cluster

  # -- Namespaces to watch when `rbac.scope` is `namespace`. This list must be
  # nonempty for namespace scope and empty for cluster scope.
  allowedNamespaces: []
