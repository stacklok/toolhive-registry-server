      type: object
    httpapi.viewEntryInfo:
      properties:
        createdAt:
          type: string
        description:
          type: string
        entryType:
          $ref: '#/components/schemas/persistence.EntryKind'
        name:
          type: string
        position:
          type: integer
        sourceName:
          type: string
        title:
          type: string
        updatedAt:
          type: string
        version:
          type: string
      type: object
    httpapi.viewInfo:
      properties:
        createdAt:
          type: string
        creationType:
          $ref: '#/components/schemas/persistence.Origin'
        name:
          type: string
        sources:
          items:
            type: string
          type: array
          uniqueItems: false
        updatedAt:
          type: string
      type: object
    model.Argument:
      properties:
        choices:
          items:
            type: string
          type: array
          uniqueItems: false
        default:
          type: string
        description:
          type: string
        format:
          $ref: '#/components/schemas/model.Format'
        isRepeated:
          type: boolean
        isRequired:
          type: boolean
        isSecret:
          type: boolean
        name:
          example: --port
          type: string
        placeholder:
          type: string
        type:
          $ref: '#/components/schemas/model.ArgumentType'
          example: positional
        value:
          type: string
        valueHint:
          example: file_path
          type: string
        variables:
          additionalProperties:
            $ref: '#/components/schemas/model.Input'
          type: object
      type: object
    model.ArgumentType:
      enum:
      - positional
      - named
      type: string
      x-enum-varnames:
      - ArgumentTypePositional
      - ArgumentTypeNamed
    model.Format:
      enum:
      - string
      - number
      - boolean
      - filepath
      type: string
      x-enum-varnames:
      - FormatString
      - FormatNumber
      - FormatBoolean
      - FormatFilePath
    model.Icon:
      properties:
        mimeType:
          example: image/png
          type: string
        sizes:
          items:
            type: string
          type: array
          uniqueItems: false
        src:
          example: https://example.com/icon.png
          format: uri
          maxLength: 255
          type: string
        theme:
          type: string
      type: object
    model.Input:
      properties:
        choices:
          items:
            type: string
          type: array
          uniqueItems: false
        default:
          type: string
        description:
          type: string
        format:
          $ref: '#/components/schemas/model.Format'
        isRequired:
          type: boolean
        isSecret:
          type: boolean
        placeholder:
          type: string
        value:
          type: string
      type: object
    model.KeyValueInput:
      properties:
        choices:
          items:
            type: string
          type: array
          uniqueItems: false
        default:
          type: string
        description:
          type: string
        format:
          $ref: '#/components/schemas/model.Format'
        isRequired:
          type: boolean
        isSecret:
          type: boolean
        name:
          example: SOME_VARIABLE
          type: string
        placeholder:
          type: string
        value:
          type: string
        variables:
          additionalProperties:
            $ref: '#/components/schemas/model.Input'
          type: object
      type: object
    model.Package:
      properties:
        environmentVariables:
          description: EnvironmentVariables are set when running the package
          items:
            $ref: '#/components/schemas/model.KeyValueInput'
          type: array
          uniqueItems: false
        fileSha256:
          description: FileSHA256 is the SHA-256 hash for integrity verification (required
            for mcpb, optional for others)
          example: fe333e598595000ae021bd27117db32ec69af6987f507ba7a63c90638ff633ce
          pattern: ^[a-f0-9]{64}$
          type: string
        identifier:
          description: |-
            Identifier is the package identifier:
              - For NPM/PyPI/NuGet: package name or ID
              - For OCI: full image reference (e.g., "ghcr.io/owner/repo:v1.0.0")
              - For MCPB: direct download URL
          example: '@modelcontextprotocol/server-brave-search'
          minLength: 1
          type: string
        packageArguments:
          description: PackageArguments are passed to the package's binary
          items:
            $ref: '#/components/schemas/model.Argument'
          type: array
          uniqueItems: false
        registryBaseUrl:
          description: RegistryBaseURL is the base URL of the package registry (used
            by npm, pypi, nuget, cargo; not used by oci, mcpb)
          example: https://registry.npmjs.org
          format: uri
          type: string
        registryType:
          description: RegistryType indicates how to download packages (e.g., "npm",
            "pypi", "cargo", "oci", "nuget", "mcpb")
          example: npm
          minLength: 1
          type: string
        runtimeArguments:
          description: RuntimeArguments are passed to the package's runtime command
            (e.g., docker, npx)
          items:
            $ref: '#/components/schemas/model.Argument'
          type: array
          uniqueItems: false
        runtimeHint:
          description: RunTimeHint suggests the appropriate runtime for the package
          example: npx
          type: string
        transport:
          $ref: '#/components/schemas/model.Transport'
          description: Transport is required and specifies the transport protocol
            configuration
        version:
          description: Version is the package version (required for npm, pypi, nuget;
            optional for mcpb; not used by oci where version is in the identifier)
          example: 1.0.2
          maxLength: 255
          minLength: 1
          type: string
      type: object
    model.Plugin:
      properties:
        _meta:
          additionalProperties: {}
          type: object
        createdAt:
          type: string
        description:
          type: string
        icons:
          items:
            $ref: '#/components/schemas/model.PluginIcon'
          type: array
          uniqueItems: false
        id:
          type: string
        isLatest:
          type: boolean
        license:
          type: string
        metadata:
          additionalProperties: {}
          type: object
        name:
          type: string
        namespace:
          type: string
        packages:
          items:
            $ref: '#/components/schemas/model.PluginPackage'
          type: array
          uniqueItems: false
        repository:
          $ref: '#/components/schemas/model.PluginRepository'
        status:
          type: string
        title:
          type: string
        updatedAt:
          type: string
        version:
          type: string
      type: object
    model.PluginIcon:
      properties:
        label:
          type: string
        size:
          type: string
        src:
          type: string
        type:
          type: string
      type: object
    model.PluginPackage:
      properties:
        commit:
          type: string
        digest:
          type: string
        identifier:
          type: string
        mediaType:
          type: string
        ref:
          type: string
        registryType:
          type: string
        subfolder:
          type: string
        url:
          type: string
      type: object
    model.PluginRepository:
      properties:
        type:
          type: string
        url:
          type: string
      type: object
    model.Repository:
      properties:
        id:
          example: b94b5f7e-c7c6-d760-2c78-a5e9b8a5b8c9
          type: string
        source:
          example: github
          type: string
        subfolder:
          example: src/everything
          type: string
        url:
          example: https://github.com/modelcontextprotocol/servers
          format: uri
          type: string
      type: object
    model.Server:
      properties:
        $schema:
          example: https://static.modelcontextprotocol.io/schemas/2025-12-11/server.schema.json
          format: uri
          minLength: 1
          type: string
        _meta:
          $ref: '#/components/schemas/v0.ServerMeta'
        description:
          example: MCP server providing weather data and forecasts via OpenWeatherMap
            API
          maxLength: 100
          minLength: 1
          type: string
        icons:
          items:
            $ref: '#/components/schemas/model.Icon'
          type: array
          uniqueItems: false
        name:
          example: io.github.user/weather
          maxLength: 200
          minLength: 3
          pattern: ^[a-zA-Z0-9.-]+/[a-zA-Z0-9._-]+$
          type: string
        packages:
          items:
            $ref: '#/components/schemas/model.Package'
          type: array
          uniqueItems: false
        remotes:
          items:
            $ref: '#/components/schemas/model.Transport'
          type: array
          uniqueItems: false
        repository:
          $ref: '#/components/schemas/model.Repository'
        title:
          example: Weather API
          maxLength: 100
          minLength: 1
          type: string
        version:
          example: 1.0.2
          maxLength: 255
          minLength: 1
          type: string
        websiteUrl:
          example: https://modelcontextprotocol.io/examples
          format: uri
          type: string
      type: object
    model.Skill:
      properties:
        _meta:
          additionalProperties: {}
          type: object
        allowedTools:
          items:
            type: string
          type: array
          uniqueItems: false
        compatibility:
          type: string
        createdAt:
          type: string
        description:
          type: string
        icons:
          items:
            $ref: '#/components/schemas/model.SkillIcon'
          type: array
          uniqueItems: false
        id:
          type: string
        isLatest:
          type: boolean
        license:
          type: string
        metadata:
          additionalProperties: {}
          type: object
        name:
          type: string
        namespace:
          type: string
        packages:
          items:
            $ref: '#/components/schemas/model.SkillPackage'
          type: array
          uniqueItems: false
        provenance:
          $ref: '#/components/schemas/registry.Provenance'
        repository:
          $ref: '#/components/schemas/model.SkillRepository'
        status:
          type: string
        title:
          type: string
        updatedAt:
          type: string
        version:
          type: string
      type: object
    model.SkillIcon:
      properties:
        label:
          type: string
        size:
          type: string
        src:
          type: string
        type:
          type: string
      type: object
    model.SkillPackage:
      properties:
        commit:
          type: string
        digest:
          type: string
        identifier:
          type: string
        mediaType:
          type: string
        ref:
          type: string
        registryType:
          type: string
        subfolder:
          type: string
        url:
          type: string
      type: object
    model.SkillRepository:
      properties:
        type:
          type: string
        url:
          type: string
      type: object
    model.Status:
      enum:
      - active
      - deprecated
      - deleted
      type: string
      x-enum-varnames:
      - StatusActive
      - StatusDeprecated
      - StatusDeleted
    model.Transport:
      properties:
        headers:
          items:
            $ref: '#/components/schemas/model.KeyValueInput'
          type: array
          uniqueItems: false
        type:
          example: stdio
          type: string
        url:
          example: https://api.example.com/mcp
          type: string
        variables:
          additionalProperties:
            $ref: '#/components/schemas/model.Input'
          type: object
      type: object
    persistence.APISpec:
      properties:
        endpoint:
          type: string
        timeout:
          type: string
      type: object
    persistence.EntryKind:
      enum:
      - MCP
      - SKILL
      - PLUGIN
      type: string
      x-enum-varnames:
      - ServerKind
      - SkillKind
      - PluginKind
    persistence.FileSpec:
      properties:
        data:
          type: string
        path:
          type: string
        timeout:
          type: string
        url:
          type: string
      type: object
    persistence.Filter:
      properties:
        names:
          $ref: '#/components/schemas/persistence.NameFilter'
        tags:
          $ref: '#/components/schemas/persistence.NameFilter'
      type: object
    persistence.GitAuth:
      properties:
        passwordFile:
          type: string
        username:
          type: string
      type: object
    persistence.GitSpec:
      properties:
        auth:
          $ref: '#/components/schemas/persistence.GitAuth'
        branch:
          type: string
        commit:
          type: string
        path:
          type: string
        repository:
          type: string
        tag:
          type: string
      type: object
    persistence.ManagedSpec:
      type: object
    persistence.NameFilter:
      properties:
        exclude:
          items:
            type: string
          type: array
          uniqueItems: false
        include:
          items:
            type: string
          type: array
          uniqueItems: false
      type: object
    persistence.Origin:
      enum:
      - API
      - CONFIG
      type: string
      x-enum-varnames:
      - OriginAPI
      - OriginConfig
    registry.Plugin:
      properties:
        _meta:
          additionalProperties: {}
          description: Meta is an opaque payload with extended meta data details of
            the plugin.
          type: object
        description:
          description: Description is the description of the plugin.
          type: string
        icons:
          description: Icons is the list of icons for the plugin.
          items:
            $ref: '#/components/schemas/registry.SkillIcon'
          type: array
          uniqueItems: false
        license:
          description: License is the SPDX license identifier of the plugin.
          type: string
        metadata:
          additionalProperties: {}
          description: |-
            Metadata is the official metadata of the plugin as reported in the
            plugin manifest file.
          type: object
        name:
          description: |-
            Name is the name of the plugin.
            The format is that of identifiers, e.g. "my-plugin".
          type: string
        namespace:
          description: |-
            Namespace is the namespace of the plugin.
            The format is reverse-DNS, e.g. "io.github.user".
          type: string
        packages:
          description: Packages is the list of packages for the plugin.
          items:
            $ref: '#/components/schemas/registry.SkillPackage'
          type: array
          uniqueItems: false
        provenance:
          $ref: '#/components/schemas/registry.Provenance'
          description: |-
            Provenance contains the expected certificate identity and attestation
            constraints for the plugin artifact.
        repository:
          $ref: '#/components/schemas/registry.SkillRepository'
          description: Repository is the source repository of the plugin.
        status:
          description: |-
            Status is the status of the plugin.
            Can be one of "active", "deprecated", or "archived".
          type: string
        title:
          description: |-
            Title is the title of the plugin.
            This is for human consumption, not an identifier.
          type: string
        version:
          description: |-
            Version is the version of the plugin.
            Any non-empty string is valid, but ideally it should be either a
            semantic version or a commit hash.
          type: string
      type: object
    registry.Provenance:
      properties:
        attestation:
          $ref: '#/components/schemas/registry.VerifiedAttestation'
        cert_issuer:
          type: string
        repository_ref:
          type: string
        repository_uri:
          type: string
        runner_environment:
          type: string
        signer_identity:
          type: string
        sigstore_url:
          type: string
      type: object
    registry.Skill:
      properties:
        _meta:
          additionalProperties: {}
          description: Meta is an opaque payload with extended meta data details of
            the skill.
          type: object
        allowedTools:
          description: |-
            AllowedTools is the list of tools that the skill is compatible with.
            This is experimental.
          items:
            type: string
          type: array
          uniqueItems: false
        compatibility:
          description: Compatibility is the environment requirements of the skill.
          type: string
        description:
          description: Description is the description of the skill.
          type: string
        icons:
          description: Icons is the list of icons for the skill.
          items:
            $ref: '#/components/schemas/registry.SkillIcon'
          type: array
          uniqueItems: false
        license:
          description: License is the SPDX license identifier of the skill.
          type: string
        metadata:
          additionalProperties: {}
          description: |-
            Metadata is the official metadata of the skill as reported in the
            SKILL.md file.
          type: object
        name:
          description: |-
            Name is the name of the skill.
            The format is that of identifiers, e.g. "my-skill".
          type: string
        namespace:
          description: |-
            Namespace is the namespace of the skill.
            The format is reverse-DNS, e.g. "io.github.user".
          type: string
        packages:
          description: Packages is the list of packages for the skill.
          items:
            $ref: '#/components/schemas/registry.SkillPackage'
          type: array
          uniqueItems: false
        provenance:
          $ref: '#/components/schemas/registry.Provenance'
          description: |-
            Provenance is the expected signer identity for this skill, checked on
            first install instead of trust-on-first-use. Absent means unconstrained
            — most catalog entries won't have this for a while, and that must not
            break installs; it's an opt-in tightening per entry, not a requirement.

            Each field constrains independently, and an empty string leaves that
            dimension unconstrained. Attestation is the exception: setting it at
            all, even to an empty struct, requires the artifact to be attested, so
            verification fails against a signature carrying no statement. Its own
            PredicateType and Predicate then follow the usual rule and constrain
            only when set. Predicate must be a JSON object; anything else can never
            match, and Validate rejects it rather than letting it through as a
            constraint that silently fails every artifact.
        repository:
          $ref: '#/components/schemas/registry.SkillRepository'
          description: Repository is the source repository of the skill.
        status:
          description: |-
            Status is the status of the skill.
            Can be one of "active", "deprecated", or "archived".
          type: string
        title:
          description: |-
            Title is the title of the skill.
            This is for human consumption, not an identifier.
          type: string
        version:
          description: |-
            Version is the version of the skill.
            Any non-empty string is valid, but ideally it should be either a
            semantic version or a commit hash.
          type: string
      type: object
    registry.SkillIcon:
      properties:
        label:
          description: Label is the label of the icon.
          type: string
        size:
          description: Size is the size of the icon.
          type: string
        src:
          description: Src is the source of the icon.
          type: string
        type:
          description: Type is the type of the icon.
          type: string
      type: object
    registry.SkillPackage:
      properties:
        commit:
          description: Commit is the commit of the package.
          type: string
        digest:
          description: Digest is the digest of the package.
          type: string
        identifier:
          description: Identifier is the OCI identifier of the package.
          type: string
        mediaType:
          description: MediaType is the media type of the package.
          type: string
        ref:
          description: Ref is the reference of the package.
          type: string
        registryType:
          description: |-
            RegistryType is the type of registry the package is from.
            Can be "oci" or "git".
          type: string
        subfolder:
          description: Subfolder is the subfolder of the package.
          type: string
        url:
          description: URL is the URL of the package.
          type: string
      type: object
    registry.SkillRepository:
      properties:
        type:
          description: Type is the type of the repository.
          type: string
        url:
          description: URL is the URL of the repository.
          type: string
      type: object
    registry.VerifiedAttestation:
      properties:
        predicate: {}
        predicate_type:
          type: string
      type: object
    v0.Metadata:
      properties:
        count:
          type: integer
        nextCursor:
          type: string
      type: object
    v0.RegistryExtensions:
      properties:
        isLatest:
          type: boolean
        publishedAt:
          format: date-time
          type: string
        status:
          $ref: '#/components/schemas/model.Status'
        statusChangedAt:
          format: date-time
          type: string
        statusMessage:
          type: string
        updatedAt:
          format: date-time
          type: string
      type: object
    v0.ResponseMeta:
      properties:
        io.modelcontextprotocol.registry/official:
          $ref: '#/components/schemas/v0.RegistryExtensions'
      type: object
    v0.ServerJSON:
      properties:
        $schema:
          example: https://static.modelcontextprotocol.io/schemas/2025-12-11/server.schema.json
          format: uri
          minLength: 1
          type: string
        _meta:
          $ref: '#/components/schemas/v0.ServerMeta'
        description:
          example: MCP server providing weather data and forecasts via OpenWeatherMap
            API
          maxLength: 100
          minLength: 1
          type: string
        icons:
          items:
            $ref: '#/components/schemas/model.Icon'
          type: array
          uniqueItems: false
        name:
          example: io.github.user/weather
          maxLength: 200
          minLength: 3
          pattern: ^[a-zA-Z0-9.-]+/[a-zA-Z0-9._-]+$
          type: string
        packages:
          items:
