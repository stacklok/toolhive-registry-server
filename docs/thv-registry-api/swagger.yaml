externalDocs:
  description: ""
  url: ""
info:
  contact:
    url: https://github.com/stacklok/toolhive
  description: |-
    API for discovering MCP servers, skills and plugins in nonpersonalized named views.
    Cedar grants whole-instance operations; admin is optional and always authenticated.
    Existing catalogs require explicit offline exposure review before activation.

    Authentication is required by default. Use Bearer token authentication with a valid
    OAuth/OIDC access token. The /.well-known/oauth-protected-resource endpoint provides
    OAuth discovery metadata (RFC 9728).
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  title: ToolHive Registry API
  version: "0.1"
openapi: 3.1.0
paths:
  /.well-known/oauth-protected-resource:
    get:
      description: Fixed unauthenticated OAuth bootstrap. Scopes are not legacy role
        names.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/auth.protectedResourceMetadata'
          description: OK
      summary: OAuth protected-resource metadata
  /openapi.json:
    get:
      description: Get the OpenAPI 3.1.0 specification; requires Cedar metadata.read
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
          description: OpenAPI 3.1.0 specification
        "401":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Unauthorized
        "500":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: OpenAPI specification
      tags:
      - system
  /registry/{registryName}/v0.1/servers:
    get:
      description: Nonpersonalized upstream page. Requires Cedar catalog.read. All
        versions are included unless version is specified.
      parameters:
      - description: Named view
        in: path
        name: registryName
        required: true
        schema:
          type: string
      - description: Opaque continuation cursor
        in: query
        name: cursor
        schema:
          type: string
      - description: Page size; values above 1000 are clamped
        in: query
        name: limit
        schema:
          default: 30
          minimum: 1
          type: integer
      - description: Substring search
        in: query
        name: search
        schema:
          type: string
      - description: Exact version or latest
        in: query
        name: version
        schema:
          type: string
      - description: RFC3339 timestamp
        in: query
        name: updated_since
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v0.ServerListResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpapi.ErrorResponse'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpapi.ErrorResponse'
          description: Bad Request
        "403":
          content:
            application/json:
              schema:
