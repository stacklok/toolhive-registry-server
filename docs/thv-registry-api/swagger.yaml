          description: Bad Request
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpapi.ErrorResponse'
          description: Bad Request
      security:
      - BearerAuth: []
      summary: List server versions
      tags:
      - servers
