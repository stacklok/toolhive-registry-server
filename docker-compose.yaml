# ToolHive Registry API Server - Docker Compose Configuration
#
# Services:
# 1. postgres - PostgreSQL 18 development database (fixed test credentials)
# 2. registry-api - Current-source API; guarded startup requires exposure evidence
#
# New empty catalog: explicitly add docker-compose.initialize-empty.yaml.
# Existing catalog: follow docs/registry-exposure-migration.md offline before serving.
# This file never initializes existing data or removes persistent volumes.
#
# Two-User Security Model:
# This setup uses two separate database users for security:
# - db_app: Application user with limited privileges (SELECT, INSERT, UPDATE, DELETE)
# - db_migrator: Migration user with elevated privileges (CREATE, ALTER, DROP)
#
# Password Management (pgpass file):
# Passwords are provided via a pgpass file built into the container image at /home/appuser/.pgpass
# The pgpass file format is: hostname:port:database:username:password
# Example contents:
#   postgres:5432:registry:db_app:app_password
#   postgres:5432:registry:db_migrator:migration_password
#
# See: https://www.postgresql.org/docs/current/libpq-pgpass.html

services:
  postgres:
    image: postgres:18-alpine
    container_name: toolhive-registry-postgres
    environment:
      POSTGRES_USER: registry
      POSTGRES_PASSWORD: registry_password
      POSTGRES_DB: registry
      POSTGRES_INITDB_ARGS: "-E UTF8"
      # postgres:18 changed the default PGDATA to /var/lib/postgresql/$PG_MAJOR/docker.
      # The entrypoint then refuses to start when it sees a mount at the legacy
      # /var/lib/postgresql/data path (even on a fresh volume). Pin PGDATA to the
      # legacy path so the existing volume layout keeps working.
      PGDATA: /var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U registry"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - registry-network

  registry-api:
    build:
      context: .
      dockerfile: ./docker/dockerfile-compose
    container_name: toolhive-registry-api
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8081:8081"
    volumes:
      # Mount entire examples directory - all configs and registry files available
      - ./examples:/examples:ro
      # Optional custom Cedar mounts belong in a Compose override; see configuration docs.
      - registry_data:/app/data
      # pgpass file is now built into the container image
    # Use CONFIG_FILE env var to switch between configs (defaults to config-docker.yaml)
    # Example: CONFIG_FILE=config-docker-multiple.yaml docker compose up
    command: ["serve", "--config", "/examples/${CONFIG_FILE:-config-docker.yaml}", "--address", ":8080"]
    environment:
      - LOG_LEVEL=debug
      - PGPASSFILE=/home/appuser/.pgpass
    networks:
      - registry-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  registry_data:
    driver: local

networks:
  registry-network:
    driver: bridge
